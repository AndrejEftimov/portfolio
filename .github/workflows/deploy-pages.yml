name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify lockfile
        run: npm run check:lockfile

      - name: Install dependencies
        run: npm ci

      - name: Determine Pages base path
        shell: bash
        env:
          CONFIGURED_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
        run: |
          if [ -n "$CONFIGURED_BASE_PATH" ]; then
            BASE_PATH="$CONFIGURED_BASE_PATH"
          else
            REPO_NAME="${GITHUB_REPOSITORY#*/}"
            OWNER_NAME="${GITHUB_REPOSITORY%/*}"

            if [ "$REPO_NAME" = "$OWNER_NAME.github.io" ]; then
              BASE_PATH="/"
            else
              BASE_PATH="/$REPO_NAME/"
            fi
          fi

          if [[ "$BASE_PATH" != /* ]]; then
            BASE_PATH="/$BASE_PATH"
          fi

          if [[ "$BASE_PATH" != */ ]]; then
            BASE_PATH="$BASE_PATH/"
          fi

          echo "VITE_BASE_PATH=$BASE_PATH" >> "$GITHUB_ENV"
          echo "Using Vite base path: $BASE_PATH"

      - name: Verify
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
